<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>智能家居控制</title>
	<script src="js/mqttws31.js" type="text/javascript"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<link rel="stylesheet" type="text/css" href="css/mui.min.css" />
	<link rel="stylesheet" type="text/css" href="css/base.css" />
	<script type="text/javascript" src="js/mui.min.js" charset="utf-8"></script>
	<script type="text/javascript" src="js/vue.min.js"></script>
	<script type="text/javascript" src="js/app.js"></script>
	<script type="text/javascript" src="js/reconnecting-websocket.min.js"></script>
	<script type="text/javascript" src="js/update.js"></script>
	<style>
		/* 全局样式重置与基础设置 */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: "Microsoft Yahei", sans-serif;
		}
		
		body {
			padding: 20px;
			background-color: #f5f5f5;
			position: relative;
			min-height: 100vh;
			display: flex;
			justify-content: center;
		}
		
		/* 页面居中容器 */
		.page-container {
			width: 100%;
			max-width: 500px;
		}
		
		/* 背景图样式 */
		.bg-img {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			z-index: -1;
			opacity: 0.2;
		}
		
		/* 字段集样式美化 */
		fieldset {
			border: 1px solid #ddd;
			border-radius: 8px;
			padding: 20px;
			margin-bottom: 20px;
			background-color: #fff;
			box-shadow: 0 2px 8px rgba(0,0,0,0.1);
			width: 100%;
		}
		
		legend {
			font-size: 18px;
			font-weight: bold;
			color: #333;
			padding: 0 10px;
		}
		
		/* 行容器：强制左右对齐 */
		.row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
			width: 100%;
		}
		
		/* 表单元素样式：统一宽度，对齐 */
		.form-item {
			display: flex;
			align-items: center;
			gap: 8px;
			width: 48%;
		}
		
		/* 关键修复：禁止label文字换行，统一宽度 */
		label {
			color: #555;
			font-size: 14px;
			font-weight: 500;
			white-space: nowrap; /* 强制文字不换行 */
			min-width: 70px; /* 统一宽度，防止长短不一 */
		}
		
		input[type="text"] {
			padding: 8px 12px;
			border: 1px solid #ddd;
			border-radius: 4px;
			font-size: 14px;
			width: 100%;
			outline: none;
			transition: border-color 0.3s;
		}
		
		input[type="text"]:focus {
			border-color: #409eff;
		}
		
		/* 窗帘档位专用布局：让文字和输入框在同一行 */
		.curtain-container {
			display: flex;
			align-items: center;
			gap: 8px;
			width: 100%;
		}
		.curtain-container input {
			flex: 1;
		}
		#curtain_text {
			white-space: nowrap; /* 强制文字不换行 */
		}
		
		/* 控制按钮行：所有按钮完全一样宽 */
		.btn-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
			width: 100%;
			gap: 10px;
		}
		
		/* 所有按钮统一样式：宽度100%一致 */
		input[type="button"] {
			padding: 10px 20px;
			border: none;
			border-radius: 4px;
			background-color: #409eff;
			color: #fff;
			font-size: 14px;
			cursor: pointer;
			transition: background-color 0.3s;
			flex: 1;
			width: 100%;
			white-space: nowrap;
		}
		
		input[type="button"]:hover {
			background-color: #337ecc;
		}
		
		/* 离家模式按钮特殊样式 */
		.leave-mode-btn {
			background-color: #ff7f00;
		}
		
		.leave-mode-btn:hover {
			background-color: #e67000;
		}

		/* 风扇按钮：和其他按钮完全一样宽 */
		.btn-row.fan-row {
			justify-content: center;
		}
		.btn-row.fan-row input {
			flex: 1;
			width: 100%;
			max-width: 100%;
		}
		
		/* 移动端：所有按钮宽度100%一致 */
		@media (max-width: 480px) {
			.row, .btn-row {
				flex-direction: column;
				align-items: stretch;
				gap: 10px;
			}
			.form-item {
				width: 100%;
			}
			input[type="button"] {
				width: 100% !important;
				flex: none !important;
			}
		}
	</style>
	<script>
		var temp1, serverip, flagmqttok = 0;
		var myid = "20191028";
		var flag0 = 0;

		// 窗帘档位映射
		var curtainMap = {
			0: "全开",
			1: "3/4开",
			2: "半开",
			3: "1/4开",
			4: "全关"
		};
		// 插座状态映射
		var relayMap = {
			0: "开启 (接通)",
			1: "关闭 (断开)"
		};
		// 当前模式映射
		modeMap = {
			0: "自动模式",
			1: "手动模式",
			2: "离家模式"
		};

		function websockstart() {
			var hostname = serverip,
				port = 8083,
				clientId = myid + "aa",
				timeout = 5,
				keepAlive = 100,
				cleanSession = false,
				ssl = false,
				topic = '';

			client = new Paho.MQTT.Client(hostname, port, clientId);

			var options = {
				invocationContext: {
					host: hostname,
					port: port,
					path: client.path,
					clientId: clientId
				},
				timeout: timeout,
				keepAliveInterval: keepAlive,
				cleanSession: cleanSession,
				useSSL: ssl,
				onSuccess: onConnect,
				onFailure: function (e) {
					websockstart()
				}
			};
			client.connect(options);

			function onConnect() {
				document.getElementById("st").innerHTML = "实时值(已连接)"
				flagmqttok = 1
				client.subscribe(myid)
			}

			client.onConnectionLost = onConnectionLost;
			client.onMessageArrived = onMessageArrived;

			function onConnectionLost(responseObject) {
				console.log("连接已断开");
				flagmqttok = 0
				websockstart()
			}
		}

		function onMessageArrived(message) {
			console.log("收到消息原始内容:" + message.payloadString);
			var payload = message.payloadString.trim();
			var light = null, temp = null, led_level = null, curtain_level = null, relay = null, mode = null;

			if (payload.startsWith("{") && payload.endsWith("}")) {
				try {
					var obj = JSON.parse(payload);
					light = obj.light || obj.V1;
					temp = obj.temp || obj.V2;
					led_level = obj.led_level || obj.V3;
					curtain_level = obj.curtain_level || obj.V4;
					relay = obj.relay || obj.V5;
					mode = obj.mode || obj.V6;
				} catch(e) {}
			}

			if (light === null) {
				var parts = payload.split(',');
				if (parts.length >= 6) {
					light = parseInt(parts[0]); temp = parseInt(parts[1]);
					led_level = parseInt(parts[2]); curtain_level = parseInt(parts[3]);
					relay = parseInt(parts[4]); mode = parseInt(parts[5]);
				} else {
					var numbers = payload.match(/\d+/g);
					if (numbers && numbers.length >= 6) {
						light = parseInt(numbers[0]); temp = parseInt(numbers[1]);
						led_level = parseInt(numbers[2]); curtain_level = parseInt(numbers[3]);
						relay = parseInt(numbers[4]); mode = parseInt(numbers[5]);
					} else {
						console.log("无法解析数据");
						return;
					}
				}
			}

			if (light !== null) document.getElementById("id1").value = light;
			if (temp !== null) document.getElementById("id2").value = temp;
			if (led_level !== null) document.getElementById("led_level").value = led_level;
			if (curtain_level !== null) {
				var curtainText = curtainMap[curtain_level] || curtain_level;
				document.getElementById("curtain_text").innerHTML = curtainText;
				document.getElementById("curtain_level").value = curtain_level;
			}
			if (relay !== null) {
				var relayText = relayMap[relay] || (relay ? "关闭" : "开启");
				document.getElementById("relay_state").value = relayText;
			}
			if (mode !== null) {
				var modeText = modeMap[mode] || "未知";
				document.getElementById("mode_state").value = modeText;
			}
		}

		function send(vala) {
			if (vala && client && client.isConnected) {
				message = new Paho.MQTT.Message(vala);
				message.destinationName = myid + "/ctrl";
				client.send(message);
			} else {
				console.log("MQTT未连接");
			}
		}

		function ka() { send("{\"ka\":\"\"}"); }
		function kb() { send("{\"kb\":\"\"}"); }
		function kc() { send("{\"kc\":\"\"}"); }
		function kd() { send("{\"kd\":\"\"}"); }
		function ke() { send("{\"ke\":\"\"}"); }
		function kf() { send("{\"kf\":\"\"}"); }
		function kg() { send("{\"kg\":\"\"}"); }

		function blink() {
			if (flagmqttok == 0) {
				serverip = "120.79.220.39"
				myid = document.getElementById("sn").value
				websockstart()
			}
		}

		function restart() { window.location.reload() }
	</script>
</head>

<body onload="blink()">
	<img class="bg-img" src="img/main.webp" alt="背景">
	<div class="page-container">
		<input type="text" id="sn" value="042007" hidden="hidden" />

		<fieldset>
			<legend><h3 id="st">实时值(未连接)</h3></legend>
			<div class="row">
				<div class="form-item">
					<label>光照：</label>
					<input type="text" id="id1" readonly>
				</div>
				<div class="form-item">
					<label>温度：</label>
					<input type="text" id="id2" readonly>
				</div>
			</div>
			
			<div class="row">
				<div class="form-item">
					<label>灯档位：</label>
					<input type="text" id="led_level" readonly>
				</div>
				<div class="form-item">
					<label>窗户档位：</label>
					<div class="curtain-container">
						<input type="text" id="curtain_level" readonly>
						<span id="curtain_text"></span>
					</div>
				</div>
			</div>
			
			<div class="row">
				<div class="form-item">
					<label>插座状态：</label>
					<input type="text" id="relay_state" readonly>
				</div>
				<div class="form-item">
					<label>当前模式：</label>
					<input type="text" id="mode_state" readonly>
				</div>
			</div>
		</fieldset>

		<fieldset>
			<legend><h3>控制栏</h3></legend>
			<div class="btn-row">
				<input type="button" value="自动模式" onclick="ka()">
				<input type="button" value="离家模式" onclick="kg()" class="leave-mode-btn">
			</div>
			
			<div class="btn-row">
				<input type="button" value="灯+" onclick="kb()">
				<input type="button" value="灯-" onclick="ke()">
			</div>
			
			<div class="btn-row">
				<input type="button" value="窗户+" onclick="kc()">
				<input type="button" value="窗户-" onclick="kf()">
			</div>
			
			<div class="btn-row fan-row">
				<input type="button" value="风扇" onclick="kd()">
			</div>
		</fieldset>
	</div>
</body>
</html>
